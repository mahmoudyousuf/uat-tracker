  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --closed:#c3c7c6; --grid:#e6e9e8; --axis:#c3c2b7;
  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b; --good-ink:#006300; --crit-ink:#b42525;
  --st-new:#8a9396; --st-review:#2a78d6; --st-await:#e0a100; --st-approved:#1baf7a; --st-prog:#4a3aa7;
  --st-retest:#e87ba4; --st-done:#0ca30c; --st-rej:#5b6264; --st-hold:#b8733a;
  --shadow:0 1px 2px rgba(20,26,27,.06),0 4px 16px rgba(20,26,27,.05);

}

  --bg:#0f1213; --surface:#181c1e; --surface2:#1d2224; --ink:#eef2f1; --ink2:#b5bfc0; --muted:#8a9497;
  --line:#2c3437; --line2:#232a2c; --accent:#72b8cc; --accent-ink:#0f1213; --accent-soft:#1c3139;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --closed:#4a5153; --grid:#262c2e; --axis:#3a4143;
  --good-ink:#3cc23c; --crit-ink:#ff7b7b; --st-new:#8a9497; --st-review:#3987e5; --st-await:#c98500; --st-approved:#199e70;
  --st-prog:#9085e9; --st-retest:#d55181; --st-done:#0ca30c; --st-rej:#7c8587; --st-hold:#c98a55;
  --shadow:0 1px 2px rgba(0,0,0,.3);}}
:root[data-theme="dark"]{color-scheme:dark;
  --bg:#0f1213; --surface:#181c1e; --surface2:#1d2224; --ink:#eef2f1; --ink2:#b5bfc0; --muted:#8a9497;
  --line:#2c3437; --line2:#232a2c; --accent:#72b8cc; --accent-ink:#0f1213; --accent-soft:#1c3139;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --closed:#4a5153; --grid:#262c2e; --axis:#3a4143;
  --good-ink:#3cc23c; --crit-ink:#ff7b7b; --st-new:#8a9497; --st-review:#3987e5; --st-await:#c98500; --st-approved:#199e70;
  --st-prog:#9085e9; --st-retest:#d55181; --st-done:#0ca30c; --st-rej:#7c8587; --st-hold:#c98a55;
  --shadow:0 1px 2px rgba(0,0,0,.3);}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.45}
.wrap{max-width:1280px;margin:0 auto;padding-inline:20px;padding-block:0 48px}
@media (max-width:600px){.wrap{padding-inline:16px}}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;padding-block:22px 14px}
.brand h1{margin:0;font-size:22px;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.brand p{margin:2px 0 0;color:var(--ink2);font-size:13px}
.tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px}
.tabs button{border:0;background:transparent;color:var(--ink2);font:600 13px var(--sans);padding:7px 14px;border-radius:7px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.tabs button:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:16px}
.fld{display:flex;flex-direction:column;gap:3px;min-width:0}
.fld>span{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
select,input,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:6px 8px;min-width:0;max-width:100%}
textarea{resize:vertical;width:100%}
.filters select{min-width:130px}
.filters input[type=date]{width:140px}
.btn{font:600 13px var(--sans);border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:7px;padding:7px 12px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--crit-ink);border-color:color-mix(in srgb,var(--crit) 40%,var(--line))}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink2)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.banner{padding:10px 14px;border-radius:10px;margin-bottom:14px;font-size:13px;border:1px solid var(--line);background:var(--surface)}
.banner.sample{background:var(--accent-soft);border-color:transparent}
.summary{font-size:16px;margin:0 0 14px;color:var(--ink2);text-wrap:pretty}
.summary b{color:var(--ink)}
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:16px}
@media (max-width:1000px){.kpis{grid-template-columns:repeat(3,1fr)}}
@media (max-width:520px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;text-align:left;cursor:pointer;font:inherit;color:inherit;display:flex;flex-direction:column;gap:2px;position:relative}
.kpi:hover{border-color:var(--accent)}
.kpi .lab{font-size:12px;font-weight:600;color:var(--ink2)}
.kpi .val{font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.kpi .sub{font-size:12px;color:var(--muted)}
.kpi.alert .val{color:var(--crit-ink)}
.kpi.alert::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:3px;border-radius:0 3px 3px 0;background:var(--crit)}
.grid{display:grid;gap:14px;grid-template-columns:repeat(12,1fr)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-width:0}
.card h2{font-size:14px;font-weight:700;margin:0 0 2px}
.card .hint{font-size:12px;color:var(--muted);margin:0 0 10px}
.c12{grid-column:span 12}.c7{grid-column:span 7}.c5{grid-column:span 5}.c6{grid-column:span 6}.c4{grid-column:span 4}.c8{grid-column:span 8}
@media (max-width:900px){.c7,.c5,.c6,.c4,.c8{grid-column:span 12}}
.attn{border-color:color-mix(in srgb,var(--crit) 35%,var(--line))}
.attn-cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:760px){.attn-cols{grid-template-columns:1fr}}
.attn h3{font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink2);margin:0 0 6px;display:flex;align-items:center;gap:6px}
.item{display:block;width:100%;text-align:left;font:inherit;color:inherit;background:var(--surface2);border:1px solid var(--line2);border-radius:9px;padding:9px 11px;margin-bottom:8px;cursor:pointer}
.item:hover{border-color:var(--accent)}
.item .t{font-weight:600}
.item .n{font-size:13px;color:var(--ink2);margin-top:2px}
.item .m{font-size:12px;color:var(--muted);margin-top:4px;display:flex;flex-wrap:wrap;gap:4px 10px}
.empty{color:var(--muted);font-size:13px;padding:6px 0}
.id{font-family:var(--mono);font-size:12px;color:var(--ink2)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:color-mix(in srgb,var(--c) 14%,var(--surface));color:var(--ink);white-space:nowrap}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c);flex:none}
.flag{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:1px 7px;border-radius:5px;white-space:nowrap;letter-spacing:.02em}
.flag.od{background:color-mix(in srgb,var(--crit) 15%,var(--surface));color:var(--crit-ink)}
.flag.st{background:color-mix(in srgb,var(--warn) 22%,var(--surface));color:var(--ink)}
.flag.bl{background:var(--crit);color:#fff}
.flag.dc{background:color-mix(in srgb,var(--st-prog) 18%,var(--surface));color:var(--ink)}
.bars{display:flex;flex-direction:column;gap:7px}
.bar-row{display:grid;grid-template-columns:184px 1fr 34px;gap:10px;align-items:center;font-size:13px;cursor:pointer;border-radius:6px}
.bar-row:hover .track{outline:1px solid var(--line)}
@media (max-width:520px){.bar-row{grid-template-columns:160px 1fr 28px}}
.track{height:14px;border-radius:4px;background:var(--line2);overflow:hidden}
.fill{height:100%;border-radius:0 4px 4px 0;background:var(--c)}
.bar-row .num{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.prio{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.prio button{font:inherit;color:inherit;text-align:left;background:var(--surface2);border:1px solid var(--line2);border-radius:9px;padding:8px 10px;cursor:pointer}
.prio button:hover{border-color:var(--accent)}
.prio .v{font-size:22px;font-weight:700}
.prio .s{font-size:11px;color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--ink2);margin-bottom:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.legend i.ln{height:3px;border-radius:2px;vertical-align:3px;width:14px}
.chart{position:relative;width:100%}
.chart svg{display:block;width:100%;overflow:visible}
.chart text{fill:var(--muted);font:11px var(--sans)}
.tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:8px;padding:8px 10px;font-size:12px;min-width:150px;z-index:5}
.tip b{display:block;margin-bottom:4px}
.tip div{display:flex;justify-content:space-between;gap:12px}
.tip div span:last-child{font-variant-numeric:tabular-nums;font-weight:600}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13px}
th{position:sticky;top:0;background:var(--surface2);text-align:left;font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none}
th[data-sort]:hover{color:var(--ink)}
td{padding:8px 10px;border-bottom:1px solid var(--line2);vertical-align:top}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--surface2)}
td.title{min-width:240px;max-width:340px}
td.title a{color:var(--ink);font-weight:600;text-decoration:none;cursor:pointer}
td.title a:hover{text-decoration:underline}
td .sub{font-size:12px;color:var(--muted)}
td select,td input{font-size:12px;padding:4px 6px}
td input[type=date]{width:128px}
td input.owner{width:130px}
td.na{min-width:200px;max-width:280px;font-size:12px;color:var(--ink2)}
.tabular{font-variant-numeric:tabular-nums}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin-bottom:12px}
.toolbar .grow{flex:1 1 220px}
.toolbar .grow input{width:100%}
.count{font-size:13px;color:var(--ink2);margin:0 0 8px}
.drawer-bg{position:fixed;inset:0;background:rgba(10,14,15,.35);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(640px,100%);background:var(--surface);z-index:21;box-shadow:-8px 0 30px rgba(0,0,0,.18);display:flex;flex-direction:column}
.drawer header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:calc(14px + env(safe-area-inset-top,0px)) 18px 12px;border-bottom:1px solid var(--line)}
.drawer header h2{margin:0;font-size:16px}
.drawer .body{overflow-y:auto;padding:16px 18px 30px;display:flex;flex-direction:column;gap:14px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
.form .full{grid-column:1/-1}
@media (max-width:520px){.form{grid-template-columns:1fr}}
.form label{display:flex;flex-direction:column;gap:3px;font-size:12px;font-weight:600;color:var(--ink2)}
.form label.chk{flex-direction:row;align-items:center;gap:8px}
.form input,.form select{width:100%}
.sect{font-size:12px;letter-spacing:.05em;text-transform:uppercase;font-weight:700;color:var(--muted);margin:6px 0 0;border-top:1px solid var(--line2);padding-top:12px}
.timeline{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.timeline li{display:grid;grid-template-columns:92px 1fr;gap:10px;padding:8px 0;border-bottom:1px solid var(--line2);font-size:13px}
.timeline .when{font-family:var(--mono);font-size:11px;color:var(--muted);padding-top:2px}
.timeline .who{font-size:12px;color:var(--muted)}
.links a{color:var(--accent);word-break:break-all}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:9px;font-size:13px;z-index:40;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.guide{max-width:880px}
.guide h2{font-size:18px;margin:26px 0 8px}
.guide h2:first-child{margin-top:0}
.guide p,.guide li{color:var(--ink2);max-width:72ch}
.guide table td,.guide table th{cursor:default}
.guide code{font-family:var(--mono);font-size:12px;background:var(--surface2);border:1px solid var(--line2);padding:1px 5px;border-radius:4px}
.muted{color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

/* Standalone storage layer: replaces the claude.ai data service with this browser's localStorage.
   Seeded with the tracker's data exported on 2026-10-20. */
(function(){
  var KEY = "uatTracker.standalone.v1";
  var seed = JSON.parse(document.getElementById("uat-seed").textContent);
  function fresh(){ var s = {requests:{}, history:{}, config:{}}; seed.requests.forEach(function(d){ s.requests[d.id] = d.data; }); seed.history.forEach(function(d){ s.history[d.id] = d.data; }); if (seed.settings) s.config.settings = seed.settings; return s; }
  var mem = null;
  function load(){ try { var raw = localStorage.getItem(KEY); if (raw) return JSON.parse(raw); } catch(e){} return fresh(); }
  function save(){ try { localStorage.setItem(KEY, JSON.stringify(mem)); } catch(e){} }
  mem = load(); save();
  var subs = [];
  function colSnap(name){ var c = mem[name] || {}; return { docs: Object.keys(c).map(function(id){ var v = c[id]; return { id: id, exists: true, data: function(){ return JSON.parse(JSON.stringify(v)); } }; }) }; }
  function docSnap(col, id){ var c = mem[col] || {}; var v = c[id]; return { id: id, exists: v !== undefined, data: function(){ return v === undefined ? undefined : JSON.parse(JSON.stringify(v)); } }; }
  function notify(){ subs.forEach(function(s){ try { s.cb(s.kind === "col" ? colSnap(s.name) : docSnap(s.col, s.id)); } catch(e){ console.error(e); } }); }
  function split(path){ var p = path.split("/"); return [p[0], p.slice(1).join("/")]; }
  function rid(){ return Math.random().toString(36).slice(2, 12) + Date.now().toString(36); }
  var db = {
    collection: function(name){ return {
      onSnapshot: function(cb){ var s = {kind:"col", name:name, cb:cb}; subs.push(s); setTimeout(function(){ cb(colSnap(name)); }, 0); return function(){ subs = subs.filter(function(x){ return x !== s; }); }; },
      add: function(data){ var id = rid(); (mem[name] = mem[name] || {})[id] = JSON.parse(JSON.stringify(data)); save(); setTimeout(notify, 0); return Promise.resolve({ id: id }); },
      doc: function(id){ return db.doc(name + "/" + id); }
    }; },
    doc: function(path){ var sp = split(path), col = sp[0], id = sp[1]; return {
      onSnapshot: function(cb){ var s = {kind:"doc", col:col, id:id, cb:cb}; subs.push(s); setTimeout(function(){ cb(docSnap(col, id)); }, 0); return function(){ subs = subs.filter(function(x){ return x !== s; }); }; },
      set: function(data){ (mem[col] = mem[col] || {})[id] = JSON.parse(JSON.stringify(data)); save(); setTimeout(notify, 0); return Promise.resolve(); },
      update: function(data){ var c = (mem[col] = mem[col] || {}); var cur = c[id] || {}; Object.keys(data).forEach(function(k){ var v = data[k]; if (v && typeof v === "object" && v.__delete__) delete cur[k]; else cur[k] = JSON.parse(JSON.stringify(v === undefined ? null : v)); }); c[id] = cur; save(); setTimeout(notify, 0); return Promise.resolve(); },
      delete: function(){ if (mem[col]) delete mem[col][id]; save(); setTimeout(notify, 0); return Promise.resolve(); },
      get: function(){ return Promise.resolve(docSnap(col, id)); }
    }; }
  };
  window.addEventListener("storage", function(e){ if (e.key === KEY) { mem = load(); notify(); } });
  var user = { id: function(){ return Promise.resolve(null); }, can: function(){ return Promise.resolve(true); }, profiles: function(){ return Promise.resolve({}); } };
  var downloads = { save: function(o){ var blob = o.data instanceof Blob ? o.data : new Blob([o.data], {type: /\.csv$/i.test(o.filename) ? "text/csv;charset=utf-8" : "application/octet-stream"}); var a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = o.filename || "download"; document.body.appendChild(a); HTMLAnchorElement.prototype.click.call(a); a.remove(); setTimeout(function(){ URL.revokeObjectURL(a.href); }, 2000); return Promise.resolve(); } };
  window.claude = { use: function(n){ return Promise.resolve(n === "db" ? db : n === "user" ? user : n === "downloads" ? downloads : null); } };
})();

function store(k, v){ try{ localStorage.setItem("uat:"+k, JSON.stringify(v)); }catch(e){} }
function load(k, d){ try{ const v = localStorage.getItem("uat:"+k); return v ? JSON.parse(v) : d; }catch(e){ return d; } }

function toast(msg){ const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.appendChild(t); setTimeout(()=>t.remove(), 3200); }

/* ---------- derived facts ---------- */
const isOpen = r => !CLOSED.has(r.status);
const isOverdue = r => isOpen(r) && r.target && r.target < today();
const daysSinceUpdate = r => r.lastUpdate ? daysBetween(r.lastUpdate.slice(0,10), today()) : 999;
const isStale = r => isOpen(r) && r.status !== "On Hold" && daysSinceUpdate(r) > (Number(S.settings.staleDays)||7);
const weekStart = () => monday(today());
const completedThisWeek = r => r.status === "Completed" && r.completedAt && r.completedAt >= weekStart() && r.completedAt <= today();
const chip = st => `<span class="chip" style="--c:var(${STATUS_VAR[st]||"--st-new"})">${esc(st)}</span>`;
const pchip = p => `<span class="chip" style="--c:var(${PRIO_VAR[p]||"--st-new"})">${esc(p)}</span>`;
function flags(r){
  let h = "";
  if (r.blocker && isOpen(r)) h += `<span class="flag bl">Blocker</span> `;
  if (r.decisionNeeded && isOpen(r)) h += `<span class="flag dc">Decision needed</span> `;
  return h;
}

/* ---------- filters ---------- */
const F = Object.assign({project:"",customer:"",priority:"",status:""}, (() => { const v = load("filters2", {}); return {project:v.project||"",customer:v.customer||"",priority:v.priority||"",status:v.status||""}; })());
function uniq(key){ const s = new Set(); for (const r of S.reqs.values()) if (r[key]) s.add(r[key]); return [...s].sort((a,b)=>a.localeCompare(b)); }
function fillSelect(el, label, items, val){
  el.innerHTML = `<option value="">All ${esc(label)}</option>` + items.map(i => `<option${i===val?" selected":""}>${esc(i)}</option>`).join("");
  if (val && !items.includes(val)) { el.insertAdjacentHTML("beforeend", `<option selected>${esc(val)}</option>`); }
}
function renderFilterOptions(){
  fillSelect($("#fProject"), "projects", uniq("project"), F.project);
  fillSelect($("#fCustomer"), "departments", uniq("customer"), F.customer);
  fillSelect($("#fPriority"), "priorities", PRIORITIES, F.priority);
  fillSelect($("#fStatus"), "statuses", STATUSES, F.status);
  $("#dlOwners").innerHTML = "";
  $("#dlCustomers").innerHTML = uniq("customer").map(o=>`<option value="${esc(o)}">`).join("");
  $("#dlProjects").innerHTML = uniq("project").map(o=>`<option value="${esc(o)}">`).join("");
}
function filtered(){
  const out = [];
  for (const r of S.reqs.values()) {
    if (F.project && r.project !== F.project) continue;
    if (F.customer && r.customer !== F.customer) continue;
    if (F.priority && r.priority !== F.priority) continue;
    if (F.status && r.status !== F.status) continue;
    out.push(r);
  }
  return out;
}
function bindFilters(){
  const on = (id, key) => $(id).addEventListener("change", e => { F[key] = e.target.value; store("filters2", F); renderFilterOptions(); render(); });
  on("#fProject","project"); on("#fCustomer","customer"); on("#fPriority","priority"); on("#fStatus","status");
  $("#fReset").addEventListener("click", () => { Object.assign(F,{project:"",customer:"",priority:"",status:""}); store("filters2",F); renderFilterOptions(); render(); });
}
function filterNote(){
  const parts = [];
  if (F.project) parts.push(F.project); if (F.customer) parts.push(F.customer);
  if (F.priority) parts.push(F.priority + " priority"); if (F.status) parts.push(F.status);
  return parts.length ? " Showing: " + parts.join(" · ") + "." : "";
}

/* ---------- tabs ---------- */
function setView(v){
  S.view = v;
  document.querySelectorAll(".tabs button").forEach(b => b.setAttribute("aria-selected", String(b.dataset.tab === v)));
  for (const k of ["overview","register","guide"]) $("#view-"+k).hidden = k !== v;
  $("#filters").hidden = v === "guide";
  try { history.replaceState(null, "", "#"+v); } catch(e) {}
  render();
}
document.querySelectorAll(".tabs button").forEach(b => b.addEventListener("click", () => setView(b.dataset.tab)));
function goRegister(patch){ if (patch.status) { F.status = patch.status; store("filters2", F); renderFilterOptions(); delete patch.status; } Object.assign(S.reg, {q:"",status:"",category:"",flag:"",dept:""}, patch); setView("register"); window.scrollTo(0,0); }

/* ---------- history helpers ---------- */
function rebuildHistIndex(){
  S.histBy = new Map();
  for (const e of S.hist) { if (!S.histBy.has(e.requestId)) S.histBy.set(e.requestId, []); S.histBy.get(e.requestId).push(e); }
  for (const a of S.histBy.values()) a.sort((x,y) => (x.at||"").localeCompare(y.at||""));
}
function statusAsOf(r, day){
  if ((r.raised||"") > day) return null;
  const ev = S.histBy.get(r.id) || [];
  let st = null;
  for (const e of ev) { if (e.at.slice(0,10) > day) break; if (e.type === "status" || e.type === "created") st = e.to || st; }
  return st || r.status;
}
function whoLabel(e){ if (e.byId) return S.names[e.byId] || "A team member"; return e.byLabel || "Unknown"; }
async function resolveNames(){
  if (!S.user) return;
  const ids = [...new Set(S.hist.map(e=>e.byId).filter(Boolean))];
  if (!ids.length) return;
  try { const ps = await S.user.profiles(ids); let changed = false;
    for (const id of ids) { const n = (ps[id] && ps[id].name) || ""; if (n && S.names[id] !== n) { S.names[id] = n; changed = true; } }
    if (changed) scheduleRender();
  } catch(e) {}
}

function drawCharts(rs){
  const depts = uniq("customer").filter(d => rs.some(r => r.customer === d));

function describe(e){
  if (e.type === "created") return `Raised${e.to && e.to !== "New" && e.to !== "To Do" ? " (imported as " + chip(e.to) + ")" : ""}`;
  if (e.type === "status") return `Status ${e.from ? chip(e.from) + " → " : "→ "}${chip(e.to)}${e.text ? `<div class="sub">${esc(e.text)}</div>` : ""}`;
  if (e.type === "comment") return `Comment: <span dir="auto">${esc(e.text)}</span>`;
  if (e.type === "change") return `${esc(FIELD_LABEL[e.field]||e.field)}: ${esc(short(e.from))} → <b>${esc(short(e.to))}</b>`;
  return esc(e.text||"");
}
const short = v => { const s = typeof v === "boolean" ? (v?"Yes":"No") : String(v ?? "—") || "—"; return s.length > 60 ? s.slice(0,57)+"…" : (s || "—"); };

/* ---------- charts ---------- */
function svgEl(w, h, inner){ return `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" role="img">${inner}</svg>`; }
function niceMax(v){ if (v <= 5) return 5; const p = Math.pow(10, Math.floor(Math.log10(v))); for (const m of [1,2,2.5,5,10]) if (m*p >= v) return m*p; return 10*p; }

function drawStack(sel, keys, field, rs, onPick){
  const host = $(sel); if (!host) return; const W = Math.max(240, host.clientWidth || 380);
  if (!keys.length) { host.innerHTML = `<div class="empty">No data in this selection.</div>`; return; }
  const rows = keys.map(c => { const all = rs.filter(r=>r[field]===c); const o = all.filter(isOpen).length; return {c, o, cl: all.length-o, t: all.length}; });
  const lw = 112, rw = 36, bh = 20, gap = 12, top = 4, H = top + rows.length*(bh+gap);
  const max = Math.max(1, ...rows.map(r=>r.t)); const sx = v => v/max*(W-lw-rw);
  let g = "";
  rows.forEach((r,i) => { const y = top + i*(bh+gap); const wo = sx(r.o), wc = sx(r.cl);
    const lab = r.c.length > 16 ? r.c.slice(0,15)+"…" : r.c;
    g += `<text x="0" y="${y+bh/2+4}" style="fill:var(--ink2);font-size:12px">${esc(lab)}</text>`;
    g += `<rect x="${lw}" y="${y}" width="${W-lw-rw}" height="${bh}" rx="4" style="fill:var(--line2)"/>`;
    if (r.o) g += `<rect x="${lw}" y="${y}" width="${wo}" height="${bh}" rx="4" style="fill:var(--s1)"/>`;
    if (r.cl) g += `<rect x="${lw+wo+(r.o?2:0)}" y="${y}" width="${Math.max(0,wc-(r.o?2:0))}" height="${bh}" rx="4" style="fill:var(--closed)"/>`;
    g += `<text x="${W}" y="${y+bh/2+4}" text-anchor="end" style="fill:var(--ink);font-weight:600;font-size:12px">${r.t}</text>`;
    g += `<rect class="hit" data-i="${i}" x="0" y="${y-4}" width="${W}" height="${bh+8}" style="fill:transparent;cursor:pointer"/>`;
  });
  host.innerHTML = svgEl(W, H, g) + `<div class="tip" hidden></div>`;
  const tip = host.querySelector(".tip");
  host.querySelectorAll(".hit").forEach(h => {
    h.addEventListener("mousemove", ev => { const r = rows[h.dataset.i]; const b = host.getBoundingClientRect();
      tip.hidden = false; tip.innerHTML = `<b>${esc(r.c)}</b><div><span>Open</span><span>${r.o}</span></div><div><span>Closed</span><span>${r.cl}</span></div><div><span>Total</span><span>${r.t}</span></div>`;
      tip.style.left = Math.max(0, Math.min(ev.clientX - b.left + 12, b.width - 170)) + "px"; tip.style.top = (ev.clientY - b.top + 12) + "px"; });
    h.addEventListener("mouseleave", () => tip.hidden = true);
    h.addEventListener("click", () => onPick(rows[h.dataset.i].c));
  });
}

/* ---------- register ---------- */
const PRIO_ORDER = Object.fromEntries(PRIORITIES.map((p,i)=>[p,i]));
const ST_ORDER = Object.fromEntries(STATUSES.map((p,i)=>[p,i]));
const FLAG_OPTS = [["","Any"],["open","Open only"],["closed","Closed only"],["attn","Blockers & decisions"]];
function regRows(){
  const q = S.reg.q.trim().toLowerCase();
  let rs = filtered().filter(r => {
    if (S.reg.status && r.status !== S.reg.status) return false;
    if (S.reg.dept && r.customer !== S.reg.dept) return false;
    if (S.reg.category && r.category !== S.reg.category) return false;
    switch (S.reg.flag) {
      case "open": if (!isOpen(r)) return false; break;
      case "closed": if (isOpen(r)) return false; break;
      case "cust": if (!AWAIT_CUSTOMER.has(r.status)) return false; break;
      case "int": if (!AWAIT_INTERNAL.has(r.status)) return false; break;
      case "attn": if (!(isOpen(r) && (r.blocker || r.decisionNeeded))) return false; break;
    }
    if (q) { const hay = [r.id,r.title,r.description,r.customer,r.raisedBy,r.project,r.nextAction,r.resolution,r.escalation].join(" ").toLowerCase(); if (!hay.includes(q)) return false; }
    return true;
  });
  const k = S.sort.key, d = S.sort.dir;
  const val = r => k==="priority" ? PRIO_ORDER[r.priority] ?? 9 : k==="status" ? ST_ORDER[r.status] ?? 99 : (r[k] || "￿");
  rs.sort((a,b) => { const va = val(a), vb = val(b); return (va < vb ? -1 : va > vb ? 1 : 0) * d; });
  return rs;
}

/* ---------- writes ---------- */
const same = (a,b) => JSON.stringify(a ?? "") === JSON.stringify(b ?? "");
async function writeEvent(ev){ await S.db.collection("history").add(Object.assign({byId:S.me||null, byLabel:S.me?null:"Team member", at:nowIso(), sample:false}, ev)); }
function writeFailed(e){
  if (e && e.code === "invalid_argument") { S.readOnly = true; toast("Your access is view-only, so changes can't be saved. Ask the owner for Contributor access."); render(); }
  else if (e && e.code === "quota_exceeded") toast("The tracker is full (5,000 records). Remove sample or old history to add more.");
  else toast("Couldn't save just now. Check your connection and try again.");
}
async function saveChanges(id, patch, opts={}){
  if (!S.db || S.readOnly) return false;
  const r = S.reqs.get(id); if (!r) return false;
  const changed = {}, events = [];
  for (const [k,v] of Object.entries(patch)) {
    if (same(r[k], v)) continue;
    changed[k] = v;
    if (k === "status") events.push({requestId:id, type:"status", from:r.status, to:v, text:opts.note||""});
    else events.push({requestId:id, type:"change", field:k, from:r[k] ?? "", to:v});
  }
  if (!Object.keys(changed).length && !opts.comment) return true;
  if ("status" in changed) {

    for (const ev of events) await writeEvent(ev);
    if (changed.status === "Completed" && !(patch.resolution || r.resolution)) toast(`${id} marked Completed. Add a resolution in its details.`);
    else toast(`${id} updated`);
    return true;
  } catch(e) { writeFailed(e); return false; }

const COLS = [["id","Request ID"],["customer","Department"],["raisedBy","Raised By"],["project","Project"],["title","Title"],["description","Description"],
  ["category","Category"],["priority","Priority"],["status","Status"],["nextAction","Next Action"],
  ["resolution","Resolution"],["links","Links"],["blocker","Blocker"],["decisionNeeded","Decision Needed"],["escalation","Escalation Note"]];
const norm = s => String(s||"").toLowerCase().replace(/[^a-z0-9]/g,"");
const HEADER_MAP = {}; for (const [k,l] of COLS) { HEADER_MAP[norm(k)] = k; HEADER_MAP[norm(l)] = k; }
Object.assign(HEADER_MAP, {customer:"customer",department:"customer",customerdepartment:"customer",requesttitle:"title",daterasied:"raised",dateraised:"raised",targetdate:"target",lastupdated:"lastUpdate",attachments:"links",linksattachments:"links",decision:"decisionNeeded",id:"id",submittedby:"raisedBy",requestedby:"raisedBy",reporter:"raisedBy"});
function csvCell(v){ const s = v == null ? "" : String(v); return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s; }
function toCsv(rows){
  const out = [COLS.map(c=>c[1]).join(",")];
  for (const r of rows) out.push(COLS.map(([k]) => {
    let v = r[k];
    if (k === "links") v = (v||[]).map(l => l.label && l.label !== l.url ? `${l.label} | ${l.url}` : l.url).join("; ");
    if (k === "blocker" || k === "decisionNeeded") v = v ? "Yes" : "No";
    return csvCell(v);
  }).join(","));
  return out.join("\r\n");
}
function parseCsv(text){
  const rows = []; let row = [], cell = "", q = false;
  text = text.replace(/^﻿/,"");
  for (let i=0;i<text.length;i++){
    const c = text[i];
    if (q) { if (c === '"') { if (text[i+1] === '"') { cell += '"'; i++; } else q = false; } else cell += c; }
    else if (c === '"') q = true;
    else if (c === ",") { row.push(cell); cell = ""; }
    else if (c === "\n" || c === "\r") { if (c === "\r" && text[i+1] === "\n") i++; row.push(cell); rows.push(row); row = []; cell = ""; }
    else cell += c;
  }
  if (cell !== "" || row.length) { row.push(cell); rows.push(row); }
  return rows.filter(r => r.some(c => c.trim() !== ""));
}
function normDate(s){
  s = String(s||"").trim(); if (!s) return "";
  let m = /^(\d{4})-(\d{1,2})-(\d{1,2})/.exec(s); if (m) return `${m[1]}-${pad(+m[2])}-${pad(+m[3])}`;
  m = /^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})$/.exec(s); if (m) { const y = m[3].length===2 ? "20"+m[3] : m[3]; return `${y}-${pad(+m[2])}-${pad(+m[1])}`; }
  const d = new Date(s); return isNaN(d) ? "" : ymd(d);
}

(async () => {
  if (window.__UAT_SNAPSHOT__) {
    const snap = window.__UAT_SNAPSHOT__;
    S.snapshot = snap.at; S.readOnly = true;
    S.reqs = new Map(snap.requests.map(r => [r.id, r])); S.hist = snap.history;
    S.settings = Object.assign({staleDays:7}, snap.settings || {});
    S.loaded.r = S.loaded.h = true; rebuildHistIndex(); renderFilterOptions(); render(); return;
  }
  if (!window.claude || !window.claude.use) { $("#view-"+S.view).innerHTML = `<div class="card">Open this tracker from claude.ai while signed in to load the shared request data.</div>`; return; }
  const [db, user, dl] = await Promise.all([claude.use("db"), claude.use("user"), claude.use("downloads")]);
  S.db = db; S.user = user; S.downloads = dl;
  if (!db) { $("#view-"+S.view).innerHTML = `<div class="card">The shared request data can't be loaded in this view. Open the tracker from claude.ai while signed in to your organization.</div>`; return; }
  if (user) { try { S.me = await user.id(); const c = await user.can("data.write"); if (c === false) S.readOnly = true; } catch(e) {} }
  db.collection("requests").onSnapshot(snap => {
    S.reqs = new Map(snap.docs.map(d => { const v = d.data(); return [d.id, Object.assign({}, v, {id: d.id})]; }));
    S.loaded.r = true; scheduleRender();
  }, () => toast("Lost connection to the request data. Reload the page."));
  db.collection("history").onSnapshot(snap => {
    S.hist = snap.docs.map(d => Object.assign({}, d.data(), {_id: d.id})).filter(e => e.at && e.requestId);
    S.loaded.h = true; rebuildHistIndex(); scheduleRender(); resolveNames();
  }, () => {});
  db.doc("config/settings").onSnapshot(d => { if (d.exists) { S.settings = Object.assign({staleDays:7}, d.data()); scheduleRender(); } }, () => {});
})();
})();
</script>

</body></html>
